<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="./src/assets/scissors.svg" />

        <title>Hair Day</title>
  <link rel="icon" href="scissors.svg"><script defer src="main.js"></script></head>
  <body>
    <div class="container">
      <img src="./src/assets/logo.svg" alt="Hair Day" class="logo" />

      <main>
        <form class="form">
          <header>
            <h2>Agende um atendimento</h2>
            <p>
              Selecione data, horário e informe o nome do cliente para criar o
              agendamento
            </p>
          </header>

          <label for="date" class="label">Data</label>
          <div class="input">
            <i><img src="./src/assets/calendar.svg" alt="" /></i>
            <input type="date" id="date" name="date" required />
          </div>



          <fieldset class="hours-fieldset">
            <legend class="label" id="hours-legend">Horários</legend>

            <p id="hours-description" class="sr-only">
              Use as setas para navegar e a barra de espaço para selecionar.
            </p>
            
            <div 
              id="hours" 
              class="hours" 
              role="radiogroup"
              aria-labelledby="hours-legend"
            >
              <!-- Exemplo: Manhã 
              <li data-period="morning" class="hour-period">Manhã</li>
              <li data-period="morning" value="09:00" class="hour hour-available">
                09:00
              </li>-->

              <!-- Exemplo: Tarde  
              <li data-period="afternoon" class="hour-period">Tarde</li>
              <li data-period="afternoon" value="13:00" class="hour hour-unavailable">
                13:00
              </li>-->

              <!-- Exemplo: Noite 
              <li data-period="night" class="hour-period">Noite</li>
              <li data-period="night" value="19:00" class="hour hour-available">
                19:00
              </li>-->
            </div>

          </fieldset>
          

          <label for="client" class="label">Cliente</label>
          <div class="input">
            <i><img src="./src/assets/person.svg" alt="" /></i>
            <input
              type="text"
              id="client"
              name="client"
              placeholder="Nome do cliente"
              required
            />
          </div>

          <button type="submit" class="button">Agendar</button>
        </form>
      </main>
      
      <aside class="schedule">
        <header>
          <h2>Agendamentos</h2>
          <p>Visualize os agendamentos de acordo com o dia selecionado</p>
        </header>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/morning.svg" alt="Manhã" />
            <strong>Manhã</strong>
            <span>09h-12h</span>
          </header>
          <ul id="period-morning" class="period">
            <!-- Exemplo  
            <li>
              <strong>11:00</strong>
              <span>Rodrigo Gonçalves</span>
              <img
                src="./src/assets/cancel.svg"
                alt="Cancelar"
                class="cancel-icon"
              />
            </li>-->
          </ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/afternoon.svg" alt="Tarde" />
            <strong>Tarde</strong>
            <span>13h-18h</span>
          </header>
          <ul id="period-afternoon" class="period">
            <!-- Exemplo 
            <li>
              <strong>14:00</strong>
              <span>Rodrigo Gonçalves</span>
              <img
                src="./src/assets/cancel.svg"
                alt="Cancelar"
                class="cancel-icon"
              />
            </li>-->
          </ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./src/assets/night.svg" alt="noite" />
            <strong>noite</strong>
            <span>19h-21h</span>
          </header>
          <ul id="period-night" class="period">
            <!-- Exemplo 
            <li>
              <strong>19:00</strong>
              <span>Rodrigo Gonçalves</span>
              <img
                src="./src/assets/cancel.svg"
                alt="Cancelar"
                class="cancel-icon"
              />
            </li>-->
          </ul>
        </section>
      </aside>
    </div>
  </body>
</html>
